global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:11002']

  - job_name: 'ec2-node'
    scheme: https
    static_configs:
      - targets: ['3rbsud9cuecz.shares.zrok.io']   # ← replace with your EC2 Public IP
        labels:
          instance: 'my-ec2'
          env: 'lab'
